<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aasi — font options</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bodoni+Moda:opsz,wght@6..96,600&family=Cinzel:wght@600&family=Fraunces:opsz,wght@9..144,700&family=Italiana&family=Megrim&family=Poiret+One&family=Unbounded:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #fafaf8;
        color: #0f0f0f;
        font-family: system-ui, sans-serif;
      }
      .option {
        width: 640px;
        height: 140px;
        padding: 28px 40px;
        background: #ffffff;
        border: 1px solid #e8e6e1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }
      .label {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #6b6b6b;
      }
      .mark {
        font-size: 42px;
        line-height: 1;
        color: #0f0f0f;
      }
      .opt-1 .mark {
        font-family: "Unbounded", sans-serif;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .opt-2 .mark {
        font-family: "Poiret One", sans-serif;
        font-weight: 400;
        letter-spacing: 0.14em;
      }
      .opt-3 .mark {
        font-family: "Bodoni Moda", serif;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      .opt-4 .mark {
        font-family: "Fraunces", serif;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .opt-5 .mark {
        font-family: "Cinzel", serif;
        font-weight: 600;
        letter-spacing: 0.12em;
      }
      .opt-6 .mark {
        font-family: "Italiana", serif;
        font-weight: 400;
        letter-spacing: 0.16em;
      }
      .opt-7 .mark {
        font-family: "Megrim", sans-serif;
        font-weight: 400;
        letter-spacing: 0.2em;
      }
      .opt-8 .mark {
        font-family: "Abril Fatface", serif;
        font-weight: 400;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="opt-1" class="option opt-1">
      <span class="label">Option 1 — Unbounded</span>
      <span class="mark">Aasi</span>
    </div>
    <div id="opt-2" class="option opt-2">
      <span class="label">Option 2 — Poiret One</span>
      <span class="mark">Aasi</span>
    </div>
    <div id="opt-3" class="option opt-3">
      <span class="label">Option 3 — Bodoni Moda</span>
      <span class="mark">Aasi</span>
    </div>
    <div id="opt-4" class="option opt-4">
      <span class="label">Option 4 — Fraunces</span>
      <span class="mark">Aasi</span>
    </div>
    <div id="opt-5" class="option opt-5">
      <span class="label">Option 5 — Cinzel</span>
      <span class="mark">Aasi</span>
    </div>
    <div id="opt-6" class="option opt-6">
      <span class="label">Option 6 — Italiana</span>
      <span class="mark">Aasi</span>
    </div>
    <div id="opt-7" class="option opt-7">
      <span class="label">Option 7 — Megrim</span>
      <span class="mark">Aasi</span>
    </div>
    <div id="opt-8" class="option opt-8">
      <span class="label">Option 8 — Abril Fatface</span>
      <span class="mark">Aasi</span>
    </div>
  </body>
</html>
